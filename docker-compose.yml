services:
  web:
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.brand.rule=Host(`brand.rjm.ie`)'
      - 'traefik.http.services.brand.loadbalancer.server.port=3000'
      - 'traefik.http.routers.brand.entrypoints=websecure'
      - 'traefik.http.routers.brand.tls.certresolver=external-resolver'
      - 'external-service=true'
      - 'traefik.docker.network=traefik-external'
    build: .
    container_name: brand
    environment:
      # Analytics
      PUBLIC_ENABLE_ANALYTICS: false
      PUBLIC_ANALYTICS_LINK: CHANGEME
      PUBLIC_ANALYTICS_ID: CHANGEME

      # Feature Toggles
